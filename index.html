<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Allergan Aesthetics AMI 竞品情报仪表盘 | AMI Intel Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =================================================================
   ALLERGAN AESTHETICS AMI — COMPETITIVE INTELLIGENCE DASHBOARD
   Design: Multi-Theme Luxury Intelligence Dashboard
   Themes: Chanel High-Luxury / Data Monitor Blue / Allergan Burgundy
   ================================================================= */

/* ----- RESET & CSS VARIABLES ----- */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --radius: 0px;
  --radius-lg: 0px;
  --radius-xl: 0px;
  --sidebar-width: 230px;
  --header-height: 0px;
  --transition-fast: 0.2s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.45s ease;
  --font-display: 'Noto Serif SC', 'Cormorant Garamond', 'Microsoft YaHei', '微软雅黑', serif;
  --font-body: 'Noto Sans SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Consolas', 'Microsoft YaHei', monospace;
}

/* =================================================================
   THEME 1: CHANEL HIGH-LUXURY (default)
   ================================================================= */
:root[data-theme="chanel"], :root:not([data-theme]) {
  --bg-deep: #F5F1EB;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FBF9F6;
  --bg-sidebar: #FFFFFF;
  --bg-input: #F7F3ED;
  --accent: #B8963E;
  --accent-dark: #111111;
  --accent-dim: rgba(184,150,62,0.06);
  --accent-glow: rgba(184,150,62,0.1);
  --threat: #A52A2A;
  --threat-dim: rgba(165,42,42,0.06);
  --threat-glow: rgba(165,42,42,0.08);
  --warning: #C49A6C;
  --warning-dim: rgba(196,154,108,0.08);
  --warning-glow: rgba(196,154,108,0.1);
  --positive: #4A6741;
  --positive-dim: rgba(74,103,65,0.06);
  --positive-glow: rgba(74,103,65,0.08);
  --text-primary: #111111;
  --text-secondary: #555555;
  --text-muted: #9B9B9B;
  --border: rgba(17,17,17,0.08);
  --border-hover: rgba(17,17,17,0.2);
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg: 0 2px 12px rgba(0,0,0,0.06);
  --sidebar-border: var(--accent-dark);
  --table-header-bg: var(--accent-dark);
  --table-header-color: #FFFFFF;
  --filter-active-bg: var(--accent-dark);
  --filter-active-color: #FFFFFF;
  --stat-accent-color: var(--accent-dark);
  --sidebar-text: var(--text-primary);
  --sidebar-text-muted: var(--text-muted);
  --sidebar-title: var(--accent-dark);
  --sidebar-footer-border: rgba(17,17,17,0.06);
}

/* =================================================================
   THEME 2: DATA MONITOR CLASSIC BLUE
   ================================================================= */
:root[data-theme="monitor"] {
  --bg-deep: #0A1628;
  --bg-card: #112240;
  --bg-card-hover: #1A2F50;
  --bg-sidebar: #0D1F3A;
  --bg-input: #162A4A;
  --accent: #00D4FF;
  --accent-dark: #00D4FF;
  --accent-dim: rgba(0,212,255,0.08);
  --accent-glow: rgba(0,212,255,0.15);
  --threat: #FF4757;
  --threat-dim: rgba(255,71,87,0.1);
  --threat-glow: rgba(255,71,87,0.15);
  --warning: #FFB142;
  --warning-dim: rgba(255,177,66,0.1);
  --warning-glow: rgba(255,177,66,0.12);
  --positive: #2ED573;
  --positive-dim: rgba(46,213,115,0.08);
  --positive-glow: rgba(46,213,115,0.12);
  --text-primary: #E8ECF1;
  --text-secondary: #8899AA;
  --text-muted: #5A6D82;
  --border: rgba(0,212,255,0.12);
  --border-hover: rgba(0,212,255,0.3);
  --shadow: 0 1px 4px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
  --sidebar-border: var(--border);
  --table-header-bg: #0D1F3A;
  --table-header-color: var(--accent);
  --filter-active-bg: var(--accent);
  --filter-active-color: #0A1628;
  --stat-accent-color: var(--accent);
  --sidebar-text: #8899AA;
  --sidebar-text-muted: #4A6078;
  --sidebar-title: var(--accent);
  --sidebar-footer-border: rgba(0,212,255,0.1);
}

/* =================================================================
   THEME 3: ALLERGAN PPT TEMPLATE (BURGUNDY + DEEP BLUE)
   ================================================================= */
/* Allergan theme — Juvéderm Purple driven by actual PPT template   */
:root[data-theme="allergan"] {
  --bg-deep: #F4EFF4;
  --bg-card: #FFFFFF;
  --bg-card-hover: #F9F2F9;
  --bg-sidebar: #1A0E16;
  --bg-input: #F6F0F5;
  --accent: #8B007C;
  --accent-dark: #5B0055;
  --accent-dim: rgba(139,0,124,0.06);
  --accent-glow: rgba(139,0,124,0.12);
  --threat: #8B007C;
  --threat-dim: rgba(139,0,124,0.08);
  --threat-glow: rgba(139,0,124,0.12);
  --warning: #C8943A;
  --warning-dim: rgba(200,148,58,0.1);
  --warning-glow: rgba(200,148,58,0.12);
  --positive: #3A7D5A;
  --positive-dim: rgba(58,125,90,0.06);
  --positive-glow: rgba(58,125,90,0.08);
  --text-primary: #1A0E20;
  --text-secondary: #4A2E50;
  --text-muted: #8A6E90;
  --border: rgba(139,0,124,0.1);
  --border-hover: rgba(139,0,124,0.3);
  --shadow: 0 1px 3px rgba(90,0,80,0.04);
  --shadow-lg: 0 2px 12px rgba(90,0,80,0.08);
  --sidebar-border: var(--accent-dark);
  --table-header-bg: #8B007C;
  --table-header-color: #FFFFFF;
  --filter-active-bg: var(--accent);
  --filter-active-color: #FFFFFF;
  --stat-accent-color: var(--accent-dark);
  --sidebar-text: #D0C8E0;
  --sidebar-text-muted: #9888B0;
  --sidebar-title: #FFFFFF;
  --sidebar-footer-border: rgba(255,255,255,0.1);
}

/* ----- PER-THEME BACKGROUND & SCROLLBAR ----- */
:root[data-theme="chanel"] body::before,
:root:not([data-theme]) body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: #F5F1EB;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.003) 2px, rgba(0,0,0,0.003) 4px);
}
:root[data-theme="monitor"] body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: #0A1628;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(0,212,255,0.02) 0%, transparent 50%);
}
:root[data-theme="allergan"] body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background: #F4EFF4;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(200,60,80,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(35,55,110,0.03) 0%, transparent 50%);
}

/* scrollbar — chanel / allergan light */
:root[data-theme="chanel"] ::-webkit-scrollbar,
:root:not([data-theme]) ::-webkit-scrollbar,
:root[data-theme="allergan"] ::-webkit-scrollbar { width: 5px; }
:root[data-theme="chanel"] ::-webkit-scrollbar-track,
:root:not([data-theme]) ::-webkit-scrollbar-track,
:root[data-theme="allergan"] ::-webkit-scrollbar-track { background: var(--bg-deep); }
:root[data-theme="chanel"] ::-webkit-scrollbar-thumb,
:root:not([data-theme]) ::-webkit-scrollbar-thumb,
:root[data-theme="allergan"] ::-webkit-scrollbar-thumb { background: #C5BDB5; }
:root[data-theme="chanel"] ::-webkit-scrollbar-thumb:hover,
:root:not([data-theme]) ::-webkit-scrollbar-thumb:hover,
:root[data-theme="allergan"] ::-webkit-scrollbar-thumb:hover { background: #A09890; }

/* scrollbar — monitor dark */
:root[data-theme="monitor"] ::-webkit-scrollbar { width: 5px; }
:root[data-theme="monitor"] ::-webkit-scrollbar-track { background: #0D1F3A; }
:root[data-theme="monitor"] ::-webkit-scrollbar-thumb { background: #1A3A60; }
:root[data-theme="monitor"] ::-webkit-scrollbar-thumb:hover { background: #2A5078; }


/* ----- SIDEBAR (DESKTOP) · PER-THEME PANEL ----- */
.sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 2px solid var(--sidebar-border);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--sidebar-footer-border);
}
.sidebar-logo {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 6px;
  color: var(--sidebar-title);
  text-transform: uppercase;
  font-family: var(--font-display);
}
.sidebar-subtitle {
  font-size: 9px;
  color: var(--sidebar-text-muted);
  margin-top: 6px;
  font-family: var(--font-body);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 300;
}
.sidebar-divider {
  height: 1px;
  background: var(--sidebar-footer-border);
  margin: 0 24px;
}
.sidebar-status {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 14px; font-size: 10px; color: var(--positive);
  font-family: var(--font-mono); font-weight: 400;
  letter-spacing: 1px;
}
.sidebar-status-dot {
  width: 5px; height: 5px; background: var(--positive);
  animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.sidebar-section-label {
  padding: 16px 24px 6px;
  font-size: 8px;
  color: var(--sidebar-text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-family: var(--font-body);
  font-weight: 400;
}
.sidebar-nav { flex: 1; padding: 2px 0; }
.sidebar-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 24px; cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 12px; color: var(--sidebar-text);
  position: relative;
  font-weight: 300;
  font-family: var(--font-body);
  letter-spacing: 0.5px;
}
.sidebar-nav-item::after {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--accent);
  transform: scaleY(0); transition: transform 0.25s ease;
}
.sidebar-nav-item:hover {
  background: var(--accent-dim);
  color: var(--sidebar-title);
}
.sidebar-nav-item.active {
  background: var(--accent-dim);
  color: var(--sidebar-title);
  font-weight: 500;
}
.sidebar-nav-item.active::after { transform: scaleY(1); }
.sidebar-nav-item .nav-badge {
  margin-left: auto;
  font-size: 8px;
  background: var(--threat-dim);
  color: var(--threat);
  padding: 1px 7px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.5px;
}
.sidebar-nav-icon { font-size: 14px; width: 22px; text-align: center; line-height: 1; opacity: 0.6; }
.sidebar-nav-item.active .sidebar-nav-icon { opacity: 1; }

/* ----- THEME SWITCHER ----- */
.theme-switcher {
  padding: 12px 24px 14px;
  border-top: 1px solid var(--sidebar-footer-border);
}
.theme-switcher-label {
  font-size: 8px;
  color: var(--sidebar-text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  font-family: var(--font-body);
  font-weight: 400;
  margin-bottom: 8px;
}
.theme-switcher-btns {
  display: flex; flex-direction: column; gap: 4px;
}
.theme-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--sidebar-text);
  font-size: 10px;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all var(--transition-fast);
  text-align: left;
  font-weight: 300;
  position: relative;
}
.theme-btn:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--sidebar-title);
}
.theme-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--sidebar-title);
  font-weight: 500;
}
.theme-btn .theme-dot {
  width: 10px; height: 10px;
  flex-shrink: 0;
}
.theme-dot.chanel   { background: #B8963E; border: 1px solid #8E7A2E; }
.theme-dot.monitor  { background: #00D4FF; border: 1px solid #0099CC; }
.theme-dot.allergan { background: #8B007C; border: 1px solid #5B0055; }

.sidebar-footer {
  padding: 18px 24px;
  border-top: 1px solid var(--sidebar-footer-border);
  font-size: 9px; color: var(--sidebar-text-muted);
  font-family: var(--font-body);
  line-height: 1.6;
  font-weight: 300;
}
.sidebar-footer strong { color: var(--sidebar-title); font-weight: 500; }

/* ----- MAIN CONTENT · AIRY LUXURY CANVAS ----- */
.main-content {
  margin-left: var(--sidebar-width);
  padding: 36px 48px 48px;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ----- PAGE TRANSITIONS ----- */
.tab-panel {
  display: none;
  animation: fadeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.tab-panel.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ----- PAGE HEADER · SERIF ELEGANCE ----- */
.page-header { margin-bottom: 32px; }
.page-title {
  font-size: 28px; font-weight: 300; color: var(--text-primary);
  margin-bottom: 4px; letter-spacing: 0px;
  font-family: var(--font-display);
}
.page-subtitle {
  font-size: 13px; color: var(--text-muted);
  font-family: var(--font-body);
  letter-spacing: 1px;
  font-weight: 300;
  text-transform: uppercase;
}

/* ----- BREADCRUMB · GOLD DUST TRAIL ----- */
.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px; font-size: 11px; color: var(--text-muted);
  font-family: var(--font-body); font-weight: 300;
}
.breadcrumb span { color: var(--accent-dark); }

/* ----- STAT CARDS · TAILORED POCKETS ----- */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 22px 24px;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  cursor: pointer;
  text-decoration: none;
  display: block;
}
.stat-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.4s ease;
}
.stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.05); }
.stat-card:hover::before { transform: scaleX(1); }
.stat-label {
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 2px;
  font-family: var(--font-body); margin-bottom: 10px;
  font-weight: 300;
}
.stat-value { font-size: 34px; font-weight: 300; font-family: var(--font-display); transition: color 0.3s ease; }
.stat-value.accent { color: var(--accent-dark); }
.stat-value.threat { color: var(--threat); }
.stat-value.positive { color: var(--positive); }
.stat-value.warning { color: var(--warning); }
.stat-change { font-size: 11px; margin-top: 6px; font-family: var(--font-body); font-weight: 300; }
.stat-change.up { color: var(--threat); }
.stat-change.down { color: var(--positive); }
.stat-change.neutral { color: var(--text-muted); }
.stat-source {
  display: flex; align-items: center; gap: 4px;
  font-size: 9px; color: var(--text-muted); margin-top: 10px;
  font-family: var(--font-body); font-weight: 300;
  opacity: 0.5; transition: opacity var(--transition-fast);
}
.stat-card:hover .stat-source { opacity: 0.8; color: var(--accent); }
.stat-source-icon { font-size: 10px; }

/* ----- PRODUCT HIGHLIGHT · SIGNATURE STRIPE ----- */
.product-highlight {
  background: var(--bg-card);
  border-top: 2px solid var(--accent-dark);
  border-bottom: 2px solid var(--accent-dark);
  padding: 26px 30px;
  margin-bottom: 32px;
  position: relative;
}
.product-highlight::before {
  content: '';
  position: absolute; top: 4px; left: 0; right: 0; bottom: 4px;
  border-top: 1px solid var(--accent);
  border-bottom: 1px solid var(--accent);
  opacity: 0.2; pointer-events: none;
}
.product-highlight-title {
  font-size: 9px; color: var(--accent);
  text-transform: uppercase; letter-spacing: 3px;
  font-family: var(--font-body); margin-bottom: 8px;
  font-weight: 400;
}
.product-highlight-text {
  font-size: 18px; font-weight: 300; color: var(--text-primary);
  font-family: var(--font-display); line-height: 1.4;
}
.product-highlight-sub {
  font-size: 13px; color: var(--text-secondary); margin-top: 8px;
  max-width: 720px; font-weight: 300; line-height: 1.6;
}
.product-highlight-link {
  font-size: 12px; margin-top: 12px; display: inline-block;
  font-weight: 300;
}

/* ----- THREAT CARDS · REFINED ALERT NOTES ----- */
.threat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.threat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 22px 24px;
  position: relative;
  transition: all 0.35s ease;
  cursor: default;
  overflow: hidden;
}
.threat-card::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--accent-dim);
  opacity: 0; transition: opacity var(--transition-normal);
}
.threat-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.05);
  border-color: var(--border-hover);
}
.threat-card:hover::before { opacity: 1; }
.threat-card .threat-badge {
  position: absolute; top: 18px; right: 20px;
  font-size: 9px; font-weight: 400; padding: 3px 10px;
  font-family: var(--font-body);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.threat-card.critical { border-left: 3px solid var(--threat); }
.threat-card.critical .threat-badge { background: var(--threat-dim); color: var(--threat); }
.threat-card.high { border-left: 3px solid var(--warning); }
.threat-card.high .threat-badge { background: var(--warning-dim); color: var(--warning); }
.threat-card.medium { border-left: 3px solid var(--warning); }
.threat-card.medium .threat-badge { background: var(--warning-dim); color: var(--warning); }
.threat-card.low { border-left: 3px solid #D5D0C8; }
.threat-card.low .threat-badge { background: rgba(0,0,0,0.03); color: var(--text-muted); }
.threat-card-company {
  font-size: 15px; font-weight: 300; color: var(--text-primary);
  margin-bottom: 2px; padding-right: 80px;
  font-family: var(--font-display); letter-spacing: 0.5px;
}
.threat-card-product {
  font-size: 12px; color: var(--accent); margin-bottom: 10px;
  font-family: var(--font-body); font-weight: 300;
}
.threat-card-desc {
  font-size: 12px; color: var(--text-secondary);
  line-height: 1.65; margin-bottom: 14px; font-weight: 300;
}
.threat-card-link { font-size: 11px; font-weight: 300; }

/* ----- SECTION COMMONS · DOUBLE LINE MOTIF ----- */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.section-title {
  font-size: 17px; font-weight: 300; color: var(--text-primary);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); letter-spacing: 0.5px;
}
.section-title-icon { color: var(--accent-dark); font-size: 14px; }
.section-divider {
  height: 1px; background: var(--accent-dark); margin: 24px 0;
  position: relative; opacity: 0.15;
}
.section-divider::after {
  content: '';
  position: absolute; left: 0; top: 3px;
  width: 40px; height: 1px; background: var(--accent); opacity: 0.5;
}

/* ----- FILTER BUTTONS · REFINED SELECTORS ----- */
.filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 18px;
  font-size: 11px; cursor: pointer;
  transition: all var(--transition-fast);
  font-family: var(--font-body);
  font-weight: 300;
  letter-spacing: 0.5px;
}
.filter-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); }
.filter-btn.active {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: #FFFFFF;
  font-weight: 400;
}

/* ----- SEARCH · ELEGANT INPUT ----- */
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--text-muted); pointer-events: none;
}
.search-box {
  background: var(--bg-input); border: 1px solid var(--border);
  color: var(--text-primary); padding: 10px 16px 10px 36px;
  font-size: 12px; width: 260px;
  outline: none; font-family: var(--font-body); font-weight: 300;
  transition: all var(--transition-fast);
}
.search-box:focus { border-color: var(--accent-dark); box-shadow: none; }
.search-box::placeholder { color: var(--text-muted); }

/* ----- EVENT LIST (REGULATORY) · GOLD TIMELINE ----- */
.event-list { display: flex; flex-direction: column; gap: 0px; }
.event-item {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 16px 0px;
  display: flex; gap: 16px; align-items: flex-start;
  transition: all var(--transition-fast);
}
.event-item:first-child { border-top: 1px solid var(--border); }
.event-item:hover { background: var(--bg-card-hover); padding-left: 12px; }
.event-date {
  font-family: var(--font-body); font-size: 10px;
  color: var(--accent); white-space: nowrap; min-width: 90px;
  font-weight: 400; letter-spacing: 1px; text-transform: uppercase;
}
.event-text { font-size: 13px; color: var(--text-primary); flex: 1; line-height: 1.5; font-weight: 300; }
.event-text a, .event-text a:visited {
  color: var(--text-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}
.event-text a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
.event-text a::after {
  content: ' ↗'; font-size: 10px; color: var(--accent); opacity: 0;
  transition: opacity var(--transition-fast);
}
.event-text a:hover::after { opacity: 0.6; }
.event-link { font-size: 11px; white-space: nowrap; }
.event-cat {
  font-size: 9px; padding: 3px 10px;
  font-family: var(--font-body); white-space: nowrap;
  font-weight: 400; letter-spacing: 1px; text-transform: uppercase;
}
.event-cat.ha { background: var(--accent-dim); color: var(--accent-dark); }
.event-cat.botox { background: var(--threat-dim); color: var(--threat); }
.event-cat.industry { background: var(--warning-dim); color: var(--warning); }
.event-cat.water { background: #e3f2fd; color: #1976d2; }

/* ----- LITERATURE CARDS · ACADEMIC NOTES ----- */
.lit-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.lit-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 20px 24px;
  transition: all 0.3s ease;
  position: relative;
}
.lit-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: var(--accent);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.35s ease;
}
.lit-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  transform: translateY(-1px);
}
.lit-card:hover::after { transform: scaleX(1); }
.lit-card-authors { font-size: 11px; color: var(--text-muted); font-weight: 300; }
.lit-card-journal {
  font-size: 10px; color: var(--accent);
  font-family: var(--font-body); margin: 4px 0 8px;
  font-weight: 400; letter-spacing: 1px; text-transform: uppercase;
}
.lit-card-title {
  font-size: 14px; font-weight: 400; color: var(--accent-dark); line-height: 1.5; margin-bottom: 12px;
  font-family: var(--font-display);
}
.lit-card-title a, .lit-card-title a:visited {
  color: var(--text-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
  cursor: pointer;
}
.lit-card-title a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
.lit-card-meta {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.lit-card-badge {
  font-size: 9px; padding: 2px 10px;
  font-family: var(--font-body); font-weight: 400; letter-spacing: 1px;
}
.lit-card-badge.ha { background: var(--accent-dim); color: var(--accent-dark); }
.lit-card-badge.botox { background: var(--threat-dim); color: var(--threat); }
.lit-card-badge.regen { background: var(--positive-dim); color: var(--positive); }
.lit-card-badge.caha { background: var(--warning-dim); color: var(--warning); }
.lit-card-badge.water { background: #e3f2fd; color: #1976d2; }
.lit-card-pmid { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); font-weight: 300; }
.lit-card-link { font-size: 11px; margin-left: auto; font-weight: 300; }
.lit-card-empty {
  grid-column: 1 / -1;
  text-align: center; padding: 48px; color: var(--text-muted);
  font-size: 13px; font-weight: 300;
}

/* ----- KOL CARDS · THOUGHT LEADERS ----- */
.kol-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.kol-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 22px 24px;
  transition: all 0.3s ease;
}
.kol-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
}
.kol-card-date {
  font-family: var(--font-body); font-size: 10px;
  color: var(--accent); font-weight: 400; letter-spacing: 1px;
  text-transform: uppercase;
}
.kol-card-name { font-size: 17px; font-weight: 300; margin: 4px 0 10px; color: var(--text-primary); font-family: var(--font-display); }
.kol-card-name a, .kol-card-name a:visited {
  color: var(--text-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
  cursor: pointer;
}
.kol-card-name a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 3px; }
.kol-card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 12px; font-weight: 300; }
.kol-card-link { font-size: 11px; }

.kol-quote {
  background: var(--bg-card); border: 1px solid var(--border);
  border-left: 3px solid var(--accent-dark);
  padding: 18px 20px; margin: 0 0 14px;
  font-size: 14px; color: var(--text-secondary);
  font-style: italic; line-height: 1.65; font-family: var(--font-display);
}
.kol-quote-author {
  font-size: 11px; color: var(--accent-dark); margin-top: 8px;
  font-style: normal; font-weight: 400; font-family: var(--font-body);
}
.kol-quote-zh {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-secondary);
  font-style: normal; line-height: 1.7; font-weight: 300;
}
.kol-quote-source {
  margin-top: 10px; font-size: 11px;
}
.kol-quote-source a {
  display: inline-flex; align-items: center;
  padding: 4px 10px; margin-right: 4px;
  background: var(--accent-dim);
  border: 1px solid var(--border);
  color: var(--accent-dark);
  text-decoration: none;
  font-size: 10px; transition: all 0.2s; font-weight: 300;
}
.kol-quote-source a:hover {
  background: var(--accent-dark);
  color: #FFFFFF;
  border-color: var(--accent-dark);
}

/* ----- MATRIX TABLE · HAUTE COUTURE GRID ----- */
.matrix-section { margin-bottom: 40px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--border); }
.matrix-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
  background: var(--bg-card); min-width: 700px; table-layout: fixed;
}
.matrix-table thead th {
  background: var(--accent-dark); padding: 12px 16px; text-align: left;
  font-size: 9px; color: #FFFFFF;
  text-transform: uppercase; letter-spacing: 1.5px;
  font-family: var(--font-body); font-weight: 400;
  border-bottom: 2px solid var(--accent-dark);
  position: sticky; top: 0; z-index: 1;
}
.matrix-table thead th:first-child {
  position: sticky; top: 0; left: 0; z-index: 3;
}
.matrix-table tbody td {
  padding: 13px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-secondary); vertical-align: middle; font-weight: 300; font-size: 11px;
  word-break: break-word; overflow-wrap: anywhere; line-height: 1.5;
}
.matrix-table tbody td:first-child {
  position: sticky; left: 0; z-index: 2;
  background: var(--bg-card);
  box-shadow: 2px 0 4px rgba(0,0,0,0.06);
}
.matrix-table tbody tr:last-child td { border-bottom: none; }
.matrix-table tbody tr { transition: background var(--transition-fast); }
.matrix-table tbody tr:hover { background: var(--accent-dim); }
.matrix-table tbody tr:hover td { color: var(--text-primary); }
.matrix-table tbody tr:hover td:first-child { background: var(--accent-dim); }
.matrix-table .cmp-name { color: var(--accent-dark); font-weight: 500; font-size: 12px; }
.matrix-table .cmp-name a, .matrix-table .cmp-name a:visited {
  color: var(--accent-dark); text-decoration: none; transition: color var(--transition-fast); cursor: pointer;
}
.matrix-table .cmp-name a:hover { color: var(--accent); text-decoration: none; }
.matrix-table .update-link a, .matrix-table .update-link a:visited {
  color: var(--text-secondary); text-decoration: none; transition: color var(--transition-fast); cursor: pointer;
  font-weight: 300;
}
.matrix-table .update-link a:hover { color: var(--accent-dark); text-decoration: underline; text-underline-offset: 2px; }
.threat-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9px; font-weight: 400; padding: 3px 10px;
  letter-spacing: 1px;
  font-family: var(--font-body); white-space: nowrap;
  text-transform: uppercase;
}
.threat-badge.critical { background: var(--threat-dim); color: var(--threat); }
.threat-badge.high { background: var(--warning-dim); color: var(--warning); }
.threat-badge.medium { background: var(--warning-dim); color: var(--warning); }
.threat-badge.low { background: var(--accent-dim); color: var(--text-muted); }

/* ----- ALERT CARDS (STRATEGY) · ATTENTION NOTES ----- */
.alert-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.alert-card {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 22px 24px;
  position: relative; transition: all 0.3s ease;
}
.alert-card:hover { border-color: var(--border-hover); box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
.alert-card.critical { border-left: 3px solid var(--threat); }
.alert-card.high { border-left: 3px solid var(--warning); }
.alert-card.monitor { border-left: 3px solid var(--accent-dark); }
.alert-level {
  font-size: 9px; font-weight: 400; letter-spacing: 2px;
  font-family: var(--font-body); margin-bottom: 6px;
  text-transform: uppercase;
}
.alert-level.critical { color: var(--threat); }
.alert-level.high { color: var(--warning); }
.alert-level.monitor { color: var(--accent-dark); }
.alert-title {
  font-size: 16px; font-weight: 300; color: var(--text-primary);
  margin-bottom: 10px; line-height: 1.4; font-family: var(--font-display);
}
.alert-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 12px; font-weight: 300; }
.alert-actions { margin: 0; padding: 0; list-style: none; }
.alert-actions li {
  font-size: 11px; color: var(--text-muted);
  margin: 5px 0; padding-left: 18px; position: relative;
  line-height: 1.5; font-weight: 300;
}
.alert-actions li::before {
  content: '→'; color: var(--accent-dark);
  position: absolute; left: 0; top: 0; font-weight: 400;
}

/* ----- RECOMMENDATION CARDS · ACTION NOTES ----- */
.rec-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.rec-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-top: 2px solid var(--accent-dark);
  padding: 22px 24px;
  transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.rec-card::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 60px; height: 60px;
  background: radial-gradient(circle at bottom right, var(--accent-glow), transparent 70%);
  pointer-events: none;
}
.rec-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  border-color: var(--border-hover);
}
.rec-num {
  font-family: var(--font-display);
  font-size: 30px; font-weight: 300;
  color: var(--accent); opacity: 0.2;
  margin-bottom: 4px; line-height: 1;
}
.rec-title { font-size: 15px; font-weight: 300; color: var(--text-primary); margin-bottom: 8px; font-family: var(--font-display); }
.rec-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.65; font-weight: 300; }

/* ----- MOBILE BOTTOM NAV · BLACK TRIM ----- */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-sidebar);
  border-top: 2px solid var(--sidebar-border);
  z-index: 200;
  padding: 2px 2px;
  padding-bottom: max(2px, env(safe-area-inset-bottom));
}
.mobile-nav-inner {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  gap: 0;
  flex: 1;
}
.mobile-nav-inner::-webkit-scrollbar { display: none; }
.mobile-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 10px; cursor: pointer; transition: all var(--transition-fast);
  min-width: 52px; border: none; background: transparent;
  color: var(--text-muted);
  font-size: 9px;
  flex-shrink: 0; font-family: var(--font-body); font-weight: 300;
}
.mobile-nav-item .mobile-nav-icon { font-size: 16px; transition: transform var(--transition-fast); opacity: 0.5; }
.mobile-nav-item .mobile-nav-label { font-size: 9px; white-space: nowrap; font-weight: 300; letter-spacing: 0.5px; }
.mobile-nav-item.active { color: var(--accent-dark); }
.mobile-nav-item.active .mobile-nav-icon { transform: translateY(-2px); opacity: 1; }
.mobile-nav-item:active { opacity: 0.7; }

.mobile-theme-row {
  display: flex; gap: 4px; padding: 4px 8px;
  border-left: 1px solid var(--sidebar-footer-border);
  flex-shrink: 0;
}
.mobile-theme-btn {
  display: flex; align-items: center; gap: 3px;
  padding: 4px 7px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted);
  font-size: 8px; font-family: var(--font-body);
  cursor: pointer; transition: all var(--transition-fast);
  white-space: nowrap; font-weight: 300;
}
.mobile-theme-btn .theme-dot { width: 8px; height: 8px; flex-shrink: 0; }
.mobile-theme-btn.active {
  background: var(--accent-dim); border-color: var(--accent);
  color: var(--accent-dark); font-weight: 500;
}
.mobile-theme-btn:active { opacity: 0.7; }

/* ----- DATA REFRESH INDICATOR ----- */
.refresh-indicator {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text-muted);
  font-family: var(--font-body); margin-left: 12px; font-weight: 300;
}
.refresh-dot {
  width: 4px; height: 4px;
  background: var(--positive);
  animation: pulse 3s ease-in-out infinite;
}

/* ----- TOOLTIP ----- */
[data-tooltip] { position: relative; }
[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: var(--accent-dark); color: #FFFFFF;
  padding: 6px 14px; font-size: 10px;
  white-space: nowrap; z-index: 300;
  font-family: var(--font-body); font-weight: 300; letter-spacing: 0.5px;
  pointer-events: none;
}

/* ----- RESPONSIVE BREAKPOINTS ----- */
@media (max-width: 1200px) {
  .threat-cards, .lit-cards, .alert-cards, .rec-cards {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .main-content { padding: 32px 36px 40px; }
}
@media (max-width: 1024px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .threat-cards, .alert-cards { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main-content {
    margin-left: 0;
    padding: 20px 16px 100px;
  }
  .mobile-nav { display: flex; align-items: center; }
  .page-title { font-size: 22px; }
  .stat-value { font-size: 26px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 16px; }
  .stat-label { font-size: 9px; }
  .threat-cards, .kol-grid, .alert-cards, .rec-cards, .lit-cards {
    grid-template-columns: 1fr;
  }
  .search-box { width: 100%; }
  .section-header { flex-direction: column; align-items: flex-start; }
  .product-highlight { padding: 18px 20px; }
  .product-highlight-text { font-size: 16px; }
  .event-item { flex-wrap: wrap; padding: 16px 0; }
  .event-date { min-width: auto; }
  .breadcrumb { font-size: 10px; overflow-x: auto; white-space: nowrap; }
}
@media (max-width: 400px) {
  .stats-row { grid-template-columns: 1fr; }
  .stat-value { font-size: 22px; }
  .mobile-nav-item { padding: 6px 8px; min-width: 44px; }
  .mobile-nav-item .mobile-nav-label { font-size: 8px; }
  .mobile-nav-item .mobile-nav-icon { font-size: 14px; }
}

/* ----- PRINT STYLES ----- */
@media print {
  .sidebar, .mobile-nav { display: none !important; }
  .main-content { margin-left: 0 !important; padding: 0 !important; }
  body { background: white; color: black; }
  .stat-card, .threat-card, .event-item, .lit-card, .kol-card, .alert-card, .rec-card {
    border: 1px solid #ccc !important; break-inside: avoid;
  }
}

</style>
</head>

/* =================================================================

const BREADCRUMBS = {

  tab3: '智能监控 / 水光竞品总览',
  tab4: '情报分析 / 文献追踪',
  tab5: '情报分析 / KOL动态',
  tab6: '情报分析 / 监管雷达'
};

let currentTab = 'tab0';

/* =================================================================
   THEME SWITCHING
   ================================================================= */
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('ami-dashboard-theme', theme);
  // Update desktop sidebar button states
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
  // Update mobile bottom nav button states
  document.querySelectorAll('.mobile-theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === theme);
  });
}
function initTheme() {
  const saved = localStorage.getItem('ami-dashboard-theme') || 'chanel';
  setTheme(saved);
}

/* =================================================================
   INITIALIZATION
   ================================================================= */
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  buildNavigation();
  switchTab('tab0');
  updateClock();
  setInterval(updateClock, 30000);

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.target.tagName === 'INPUT') return;
    const idx = TABS.findIndex(t => t.id === currentTab);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      const prev = (idx - 1 + TABS.length) % TABS.length;
      switchTab(TABS[prev].id);
    } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      const next = (idx + 1) % TABS.length;
      switchTab(TABS[next].id);
    }
  });
});

function updateClock() {
  const now = new Date();
  const ts = now.toISOString().replace('T',' ').slice(0,19) + ' CST';
  const el = document.getElementById('sidebarTime');
  if (el) el.textContent = ts;
}

/* =================================================================
   NAVIGATION BUILDING
   ================================================================= */
function buildNavigation() {
  const sidebarNav = document.getElementById('sidebarNav');
  const mobileNavInner = document.getElementById('mobileNavInner');

  sidebarNav.innerHTML = '';
  mobileNavInner.innerHTML = '';

  TABS.forEach((t, i) => {
    // Desktop sidebar item
    const div = document.createElement('div');
    div.className = 'sidebar-nav-item';
    div.setAttribute('data-tab', t.id);
    let badgeHtml = '';
    div.innerHTML = `<span class="sidebar-nav-icon">${t.icon}</span><span>${t.label}</span>${badgeHtml}`;
    div.addEventListener('click', () => switchTab(t.id));
    sidebarNav.appendChild(div);

    // Mobile bottom nav item
    const btn = document.createElement('button');
    btn.className = 'mobile-nav-item';
    btn.setAttribute('data-tab', t.id);
    btn.innerHTML = `<span class="mobile-nav-icon">${t.mobileIcon}</span><span class="mobile-nav-label">${t.mobileLabel}</span>`;
    btn.addEventListener('click', () => switchTab(t.id));
    mobileNavInner.appendChild(btn);
  });
}

/* =================================================================
   TAB SWITCHING
   ================================================================= */
function switchTab(tabId) {
  currentTab = tabId;

  // Update sidebar active state
  document.querySelectorAll('.sidebar-nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-tab') === tabId);
  });

  // Update mobile nav active state
  document.querySelectorAll('.mobile-nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-tab') === tabId);
  });

  const main = document.getElementById('mainContent');

  // Trigger reflow for animation
  main.style.opacity = '0';
  main.offsetHeight;
  main.style.opacity = '1';
  main.style.transition = 'opacity 0.2s ease';

  // Render correct page
  switch (tabId) {
    case 'tab0': renderMatrix(main); break;
    case 'tab1': renderBotox(main); break;
    case 'tab2': renderHAFillers(main); break;
    case 'tab3': renderSkinBooster(main); break;
    case 'tab4': renderLiterature(main); break;
    case 'tab5': renderKOL(main); break;
    case 'tab6': renderRegulatory(main); break;
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =================================================================
   HELPER FUNCTIONS
   ================================================================= */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'className') el.className = v;
    else if (k === 'innerHTML') el.innerHTML = v;
    else if (k.startsWith('on')) el[k] = v;
    else if (k === 'dataset') Object.entries(v).forEach(([dk, dv]) => { el.dataset[dk] = dv; });
    else el.setAttribute(k, v);
  }
  children.forEach(c => {
    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else if (c instanceof Node) el.appendChild(c);
  });
  return el;
}

function linkTag(url, text) {
  return `<a href="${url}" target="_blank" rel="noopener noreferrer">${text || url}</a>`;
}

function breadcrumbHTML(tabId) {
  return `<div class="breadcrumb"><span>AMI INTEL</span> / ${BREADCRUMBS[tabId] || ''}</div>`;
}

        <div class="lit-card-journal">${p.journal} · ${p.date}</div>
        <div class="lit-card-title"><a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}" target="_blank" rel="noopener">${p.title}</a></div>
        <div class="lit-card-meta">
          <span class="lit-card-badge ${p.cat}">${p.cat === 'ha' ? 'HA' : p.cat === 'botox' ? '肉毒' : p.cat === 'caha' ? 'CaHA' : p.cat === 'water' ? '水光' : '再生'}</span>
          <span class="lit-card-pmid">PMID: ${p.pmid}</span>
        </div>
      </div>
    `).join('');
  }

  renderLitCards('litBotoxCards', litBotox);
  renderLitCards('litHACards', litHA);
  renderLitCards('litRegenCards', litRegen);
  renderLitCards('litCahaCards', litCaha);
  renderLitCards('litWaterCards', litWater);

  // Filter
  document.getElementById('litFilterBtns').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('#litFilterBtns .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window.__litCatFilter = btn.getAttribute('data-cat');
    applyLitFilters();
  });
  window.__litCatFilter = 'all';
}

function applyLitFilters() {
  const query = (document.getElementById('litSearch')?.value || '').toLowerCase().trim();
  const cat = window.__litCatFilter || 'all';

  ['litBotoxCards', 'litHACards', 'litRegenCards', 'litCahaCards', 'litWaterCards'].forEach(listId => {
    const container = document.getElementById(listId);
    if (!container) return;
    const cards = container.querySelectorAll('.lit-card');
    let anyVisible = false;
    cards.forEach(card => {
      const cardCat = card.getAttribute('data-cat');
      const catMatch = cat === 'all' || cardCat === cat;
      const searchMatch = !query || card.getAttribute('data-search').includes(query);
      const visible = catMatch && searchMatch;
      card.style.display = visible ? '' : 'none';
      if (visible) anyVisible = true;
    });

    // Show/hide section title
    const sectionTitle = container.previousElementSibling;
    if (sectionTitle && sectionTitle.classList.contains('section-title')) {
      sectionTitle.style.display = anyVisible ? '' : 'none';
    }
    // Show/hide section divider
    const divider = container.previousElementSibling?.previousElementSibling;
    if (divider && divider.classList.contains('section-divider')) {
      divider.style.display = anyVisible ? '' : 'none';
    }
  });
}
